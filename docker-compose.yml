services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: titan_php
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: titan_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: avaliacao_titan
      MYSQL_USER: titan
      MYSQL_PASSWORD: titan123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: